spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: msvc-products
            uri: lb://msvc-products
            predicates:
            - Path=/api/products/**
            # - Header=token, 12345
            # - Method=GET, POST
            # - Query=color
            # - Cookie=color, azul
            # - Header=Content-Type, application/json
            filters:
            - StripPrefix=2
            - EjemploCookie=Hola mi mensaje personalizado para productos!, user, Enrique
          - id: msvc-items
            uri: lb://msvc-items
            predicates:
            - Path=/api/items/**
            filters:
            - StripPrefix=2
            - AddRequestHeader=token-request, aabbsjjsjsjsjs
            - AddResponseHeader=token-response, 984657893
            - AddRequestParameter=name, Enrique
            - SetResponseHeader=Content-Type, text/plain